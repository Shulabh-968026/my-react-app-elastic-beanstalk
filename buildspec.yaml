version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: latest
    commands:
      - echo "Installing dependencies"
      - npm install 
  
  build:
    commands:
      - echo "Building the project"
      - npm run build
      - ls -l dist  # Debugging step: List contents of dist folder
      - test -d dist || (echo "Error: dist/ folder missing!" && exit 1)  # Fail if dist/ is missing

  post_build:
    commands:
      - echo "Build completed successfully."

artifacts:
  files:
    - '**/*'
  base-directory: dist
  discard-paths: yes
